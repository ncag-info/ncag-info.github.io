{{ define "main" }}
<section class="content">
  {{ if .Title }}<h2>{{ .Title | safeHTML }}</h2>{{ end }}

  {{ range site.Taxonomies.tags.Alphabetical }}
    <h3 id="{{ .Page.Title | anchorize }}">{{ .Page.Title | lower }}</h3>
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        <li>{{ .Date.Format "January 2, 2006" }}: <a href="{{ .RelPermalink }}">{{ .Title | safeHTML }}</a></li>
      {{ end }}
    </ul>
  {{ end }}
</section>
{{ end }}
