<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <header>
    <h3 itemprop="name headline"><a href="{{ .RelPermalink }}">{{ .Title | safeHTML }}</a></h3>
    <div class="meta">
      <p class="time"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" itemprop="datePublished">{{ .Date.Format "January 2, 2006" }}</time></p>
    </div>
  </header>

  <div class="content" itemprop="articleBody">
    {{ .Content }}
  </div>
</article>
